[project]
name = "tool-service"
version = "0.1.0"
description = "Servicio de tools sobre los datos publicados por data-pipeline (gold_restricted), para agent-core y otros consumidores."
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.115",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.7",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
]

[project.scripts]
tool-service = "tool_service.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tool_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
